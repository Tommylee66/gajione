project_id = "gajione"

[auth]
# Where a magic link, a confirmation link or a password-reset link may send
# somebody. Supabase refuses any redirect not on this list, so a link that
# points anywhere else silently lands on the Supabase error page instead of
# the app — which is how a reset flow looks broken while every part of it works.
site_url = "https://app.aigaji.com"
additional_redirect_urls = [
  "https://app.aigaji.com/reset",
  "https://app.aigaji.com/pending",
  "https://app.aigaji.com/login",
  # The vercel.app address, kept alongside the custom domain rather than
  # replaced by it: both resolve to the same deployment, and a reset link
  # issued before the cut-over still has to work after it.
  "https://gajione.vercel.app/reset",
  "https://gajione.vercel.app/pending",
  "https://gajione.vercel.app/login",
  # Kept so the same links work against a local dev server.
  "http://localhost:3000/reset",
  "http://localhost:3000/pending",
  "http://localhost:3000/login",
]

# Restored explicitly. `supabase config push` writes the CLI's defaults for any
# auth setting the file does not mention, so pushing a file that only set the
# redirect URLs also reset these two — the email cooldown from a minute to a
# second, and the OTP from eight digits to six. Both are weaker, and neither
# was intended. Anything that matters has to be stated here rather than left
# to whatever the remote happens to hold.
[auth.email]
# Every one of these is stated rather than left to the remote, because a push
# writes the CLI's default over anything this file does not mention. That is
# how the cooldown and the OTP length were silently weakened once already —
# and how confirmations ended up off, which meant signUp confirmed the address
# itself and no mail was ever sent. Listing only the settings that have
# already gone wrong just moves the trap.
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
max_frequency = "1m0s"
otp_length = 8

# Mail goes out through Resend rather than Supabase's built-in sender. The
# built-in one is rate-limited to a couple of messages an hour — enough to
# demo, not enough for a signup confirmation and a password reset to both
# arrive on the same afternoon. We hit that limit during testing.
#
# The password is read from the environment, never written here: this file is
# in git, and the key can send mail as aigaji.com.
[auth.email.smtp]
enabled = true
host = "smtp.resend.com"
port = 587
user = "resend"
pass = "env(RESEND_API_KEY)"
admin_email = "no-reply@aigaji.com"
sender_name = "GajiOne"

# Stated for the same reason the two settings above it are: a push writes the
# CLI's default over anything this file leaves out, and that default is 2 an
# hour — the built-in sender's limit, which is the whole reason for the block
# above. Left unsaid, configuring Resend would have changed nothing.
[auth.rate_limit]
email_sent = 100
